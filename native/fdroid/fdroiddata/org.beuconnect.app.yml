Builds:
  - versionName: 1.1.3
    versionCode: 5
    commit: 88834f4eb786836a1f41f50c787d59d1864808a4
    timeout: 10800
    subdir: native
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends curl ca-certificates build-essential
        libclang-dev pkg-config libssl-dev perl unzip zip default-jdk-headless
      - mkdir -p /opt/rust
      - env RUSTUP_HOME=/opt/rust/rustup CARGO_HOME=/opt/rust/cargo sh -c 'curl --proto
        "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        --default-toolchain 1.99.1 --no-modify-path'
      - env RUSTUP_HOME=/opt/rust/rustup CARGO_HOME=/opt/rust/cargo /opt/rust/cargo/bin/rustup
        target add aarch64-linux-android
      - chmod -R a+rwX /opt/rust
    output: .nsh/out/BEUConnect.apk
    srclibs:
      - nsh@v0.3.0
    prebuild: if [ -d /opt/rust/cargo ]; then export RUSTUP_HOME=/opt/rust/rustup
      CARGO_HOME=/opt/rust/cargo RUSTUP_TOOLCHAIN=1.99.1 PATH=/opt/rust/cargo/bin:$PATH;
      fi; sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null; cd $$nsh$$
      && cargo fetch --locked
    build:
      - if [ -d /opt/rust/cargo ]; then export RUSTUP_HOME=/opt/rust/rustup CARGO_HOME=/opt/rust/cargo
        RUSTUP_TOOLCHAIN=1.99.1 PATH=/opt/rust/cargo/bin:$PATH; fi
      - L=$(find /usr/lib -maxdepth 3 -name 'libclang-*.so*' -print -quit)
      - test -z "$L" || export LIBCLANG_PATH=$(dirname "$L")
      - export NSH_SRC=$$nsh$$
      - export SIGN=0
      - ./scripts/build-nsh-from-source.sh arm64-v8a
    ndk: 28.2.13676358

MaintainerNotes: |
  Contact: the app's own issue tracker, or pritkumarrrr@gmail.com.

  Every version is built from a tag of https://github.com/pritkr/beUConnect. The
  Android host is `native/`, and it is not a Gradle project: `native/scripts/`
  runs aapt2, javac, d8, zipalign and apksigner directly, so the recipe has no
  `gradle:` and a single `build:` script.

  `NonFreeNet` is for the results screen only: it fetches from BEU's own result
  portal at beu-bih.ac.in, which is not free software and has no alternative
  endpoint. Every other screen reads data bundled in the APK.

  The interface is NativeShell (https://github.com/longbridge/nsh, Apache-2.0),
  a Rust workspace with a small Java Android runtime. Upstream ships it as a
  release tarball; this recipe builds `nsh`, `libnsh.so` and the runtime's
  classes from the v0.3.0 tag instead, so no binary enters the build.

  `nsh` pins no toolchain of its own — its `rust-toolchain.toml` says `stable` —
  so the recipe installs one version and exports `RUSTUP_TOOLCHAIN`; otherwise
  rustup would download a second toolchain mid-build. The ~700 crates come from
  crates.io in `prebuild`, into `CARGO_HOME` under `/opt/rust`, which is outside
  the source tree, so they never reach the scanner. That export is guarded by
  `[ -d /opt/rust/cargo ]`, because `fdroid build` skips `sudo:` off the build
  server and the same two commands have to work with the developer's own rustup.

  `quickjs-jit-sys` generates its bindings with `bindgen` at build time, and
  `bindgen` loads libclang, which a build server has no reason to carry: without
  it the build dies with "Unable to find libclang". So `sudo:` installs
  `libclang-dev` and `build:` points `LIBCLANG_PATH` at whichever `llvm-*`
  directory apt chose, rather than naming a version that moves with Debian.

  Both `nsh`'s Java runtime and the app's own aapt2/d8 pass compile against an
  SDK platform, and the build server image ships none, so `prebuild` installs
  `platforms;android-35` with `sdkmanager`. It installs `build-tools;35.0.0`
  too: the image's own 31.0.0 `d8` predates Java 17 class files. Neither is a
  binary in the APK — they are the compiler and its headers, the same way the
  NDK is.

  * UPSTREAM: `native/scripts/build-nsh-from-source.sh` also runs on a
    developer's machine, which is how the recipe was tested; the only thing it
    needs is a checkout of the nsh tag.

  The Rust compile dominates the build time, so `timeout: 10800` is deliberate.

